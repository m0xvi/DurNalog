name: Build EXE

on:
  push:
    tags:
      - 'v*'          # автосборка релиза на каждый тег v1.0, v2.3, ...
  workflow_dispatch:  # ручной запуск из вкладки Actions (для проверки)

# Приватные репозитории: токен по умолчанию read-only —
# без этой секции создание релиза упадёт с 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate customtkinter
        id: ctk
        shell: pwsh
        run: |
          $p = python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"
          "ctk_path=$p" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name "TurNalog"
          --add-data "${{ steps.ctk.outputs.ctk_path }};customtkinter"
          --collect-submodules openpyxl --paths TurNalog_ui --add-data "TurNalog_ui;TurNalog_ui" main.py

      - name: Pack dist
        shell: pwsh
        run: Compress-Archive -Path dist\TurNalog -DestinationPath TurNalog-win64.zip

      # Фолбэк: архив доступен в шаге Artifacts даже если релиз не создастся
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurNalog-win64
          path: TurNalog-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TurNalog-win64.zip
          generate_release_notes: true
